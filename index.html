<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eef2f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1211" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="医学刷题">
<meta name="description" content="病理生理学离线刷题：章节练习、随机练习、自动记录进度与错题本。">
<title>医学 · 刷题</title>
<style>
*, *::before, *::after { box-sizing: border-box; }

:root {
  --bg: #eef2f0;
  --bg-grad: rgba(15, 118, 110, .10);
  --surface: #ffffff;
  --surface-2: #f4f7f6;
  --surface-3: #e6eeeb;
  --ink: #16211f;
  --ink-2: #3c4c48;
  --muted: #697a75;
  --line: #dfe7e4;
  --brand: #0f766e;
  --brand-strong: #0b5e57;
  --brand-soft: #e7f4f1;
  --on-brand: #ffffff;
  --ok: #177245;
  --ok-soft: #eaf6ee;
  --ok-line: #a9d8bb;
  --bad: #b42318;
  --bad-soft: #fdecea;
  --bad-line: #f2b8b5;
  --warn: #956000;
  --warn-soft: #fff6e5;
  --warn-line: #efd7a7;
  --shadow: 0 1px 2px rgba(20, 45, 40, .04), 0 10px 30px rgba(20, 45, 40, .06);
  --shadow-soft: 0 1px 2px rgba(20, 45, 40, .04), 0 3px 12px rgba(20, 45, 40, .04);
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1211;
    --bg-grad: rgba(45, 212, 191, .07);
    --surface: #121d1b;
    --surface-2: #182522;
    --surface-3: #21332e;
    --ink: #e7f0ed;
    --ink-2: #c3d1cd;
    --muted: #96a8a3;
    --line: #273934;
    --brand: #2dd4bf;
    --brand-strong: #5eead4;
    --brand-soft: #10312c;
    --on-brand: #04211d;
    --ok: #4ade80;
    --ok-soft: #10261a;
    --ok-line: #245c3a;
    --bad: #f87171;
    --bad-soft: #2a1515;
    --bad-line: #5f2626;
    --warn: #fbbf24;
    --warn-soft: #261d0b;
    --warn-line: #5a451c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 12px 32px rgba(0, 0, 0, .25);
    --shadow-soft: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .2);
  }
}

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background:
    radial-gradient(900px 420px at 50% -140px, var(--bg-grad), transparent 70%),
    var(--bg);
  color: var(--ink);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC",
    "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid color-mix(in srgb, var(--brand) 55%, transparent); outline-offset: 2px; }
[hidden] { display: none !important; }

.wrap { max-width: 820px; margin: 0 auto; padding: 0 16px 32px; }
@media (min-width: 700px) { .wrap { padding: 0 24px 44px; } }

/* ---------- home ---------- */

.hero {
  max-width: 820px;
  margin: 0 auto;
  padding: calc(28px + env(safe-area-inset-top)) 16px 16px;
}
@media (min-width: 700px) { .hero { padding: calc(52px + env(safe-area-inset-top)) 24px 20px; } }

.eyebrow {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: .16em;
  color: var(--brand-strong);
  text-transform: uppercase;
}

.hero h1 {
  margin: 7px 0 7px;
  font-size: clamp(27px, 5.6vw, 37px);
  line-height: 1.2;
  letter-spacing: .02em;
}

.hero p { margin: 0; color: var(--muted); font-size: 13.5px; }

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 9px;
  margin: 4px 0 18px;
}

.stat {
  display: block;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 13px;
  box-shadow: var(--shadow-soft);
  min-width: 0;
}
.stat .num {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: .01em;
  line-height: 1.35;
  font-variant-numeric: tabular-nums;
}
.stat .num .den { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.stat .lab { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.stat.wrong .num { color: var(--bad); }
button.stat { cursor: pointer; border: 1px solid var(--line); }
button.stat:hover { border-color: var(--bad-line); }
@media (max-width: 380px) {
  .stat { padding: 10px; }
  .stat .num { font-size: 19px; }
}

.resume {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  margin-bottom: 18px;
  border: 1px solid color-mix(in srgb, var(--brand) 30%, var(--line));
  border-radius: 16px;
  background: linear-gradient(135deg, var(--brand-soft), var(--surface) 78%);
  box-shadow: var(--shadow-soft);
}
.resume .grow { flex: 1; min-width: 0; }
.resume-kicker { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--brand-strong); }
.resume-title {
  font-size: 15.5px;
  font-weight: 650;
  margin-top: 1px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.resume-sub { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
.resume .btn { flex: 0 0 auto; min-height: 42px; padding: 8px 18px; }

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 22px 0 10px;
}
.section-head h2 { margin: 0; font-size: 15px; letter-spacing: .02em; }

.seg {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  border-radius: 10px;
}
.seg button {
  border: 0;
  background: transparent;
  color: var(--muted);
  padding: 5px 12px;
  border-radius: 7px;
  font-size: 12.5px;
  line-height: 1.4;
  cursor: pointer;
  min-height: 29px;
}
.seg button.active {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 1px 3px rgba(20, 45, 40, .12);
}

.chapter-list { display: grid; gap: 10px; }

.chapter-card {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 15px 17px;
  box-shadow: var(--shadow-soft);
  cursor: pointer;
  transition: border-color .15s ease, transform .15s ease;
}
.chapter-card:hover { border-color: var(--brand); transform: translateY(-1px); }
.chapter-card:active { transform: translateY(0); }
.chapter-top { display: flex; align-items: center; gap: 10px; }
.chapter-name { flex: 1; font-weight: 650; font-size: 16.5px; }
.chapter-count { font-size: 12px; color: var(--muted); white-space: nowrap; }
.chapter-card .bar { margin: 12px 0 8px; }
.chapter-foot {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 12.5px;
  color: var(--muted);
}

.bar { height: 6px; border-radius: 999px; background: var(--surface-3); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--brand); border-radius: 999px; transition: width .3s ease; }

.home-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 18px;
}
.span2 { grid-column: 1 / -1; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 10px 18px;
  border-radius: 12px;
  border: 1px solid transparent;
  font-weight: 600;
  font-size: 14.5px;
  line-height: 1.3;
  background: var(--surface);
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease, color .15s ease;
}
.btn.primary { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.btn.primary:hover { background: var(--brand-strong); border-color: var(--brand-strong); }
.btn.ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn.ghost:hover { border-color: var(--brand); color: var(--brand-strong); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:disabled:hover { border-color: var(--line); color: var(--ink); }
.btn.primary:disabled:hover { background: var(--brand); border-color: var(--brand); }
.btn.block { width: 100%; }

.foot {
  margin-top: 28px;
  padding-top: 15px;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}
.foot p { margin: 0; }
.foot button {
  margin-top: 4px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 12px;
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}
.foot button:hover { color: var(--bad); }

/* ---------- shared top bar ---------- */

.practice-head {
  position: sticky;
  top: 0;
  z-index: 30;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
@supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .practice-head {
    background: color-mix(in srgb, var(--bg) 86%, transparent);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
  }
}

.topbar {
  max-width: 820px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 9px 12px;
  padding-top: calc(9px + env(safe-area-inset-top));
}
@media (min-width: 700px) { .topbar { padding-left: 20px; padding-right: 20px; } }

.topbar-title {
  flex: 1;
  min-width: 0;
  font-size: 15px;
  font-weight: 650;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.icon-btn {
  flex: 0 0 40px;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  cursor: pointer;
  font-size: 18px;
  line-height: 1;
}
.icon-btn:hover { border-color: var(--brand); }
.link-btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 10px;
  padding: 7px 12px;
  font-size: 12.5px;
  line-height: 1.4;
  cursor: pointer;
  color: var(--ink-2);
  white-space: nowrap;
  min-height: 36px;
}
.link-btn:hover { border-color: var(--brand); color: var(--brand-strong); }
.link-btn:disabled { opacity: .45; cursor: not-allowed; }

.progress-track { height: 4px; background: var(--surface-3); }
.progress-track > i { display: block; height: 100%; width: 0; background: var(--brand); transition: width .25s ease; }
.progress-meta {
  max-width: 820px;
  margin: 0 auto;
  padding: 6px 16px 0;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  font-size: 11.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
@media (min-width: 700px) { .progress-meta { padding-left: 24px; padding-right: 24px; } }

/* ---------- practice ---------- */

.practice-wrap {
  max-width: 820px;
  margin: 0 auto;
  padding: 13px 13px 118px;
}
@media (min-width: 700px) { .practice-wrap { padding: 18px 24px 110px; } }

.navigator {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px 11px;
  margin-bottom: 11px;
  box-shadow: var(--shadow-soft);
}
.nav-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 9px;
}
.nav-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(37px, 1fr));
  gap: 6px;
  max-height: 204px;
  overflow: auto;
  overscroll-behavior: contain;
}
.nav-cell {
  height: 36px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  font-size: 12px;
  color: var(--ink-2);
  cursor: pointer;
  display: grid;
  place-items: center;
  font-variant-numeric: tabular-nums;
}
.nav-cell:hover { border-color: var(--brand); }
.nav-cell.ok { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }
.nav-cell.bad { background: var(--bad-soft); border-color: var(--bad-line); color: var(--bad); }
.nav-cell.current { box-shadow: inset 0 0 0 2px var(--brand); font-weight: 700; color: var(--brand-strong); }
.nav-legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; color: var(--muted); margin-top: 9px; }
.nav-legend span { display: inline-flex; align-items: center; gap: 4px; }
.nav-legend i { width: 10px; height: 10px; border-radius: 3px; border: 1px solid var(--line); background: var(--surface-2); }
.nav-legend i.ok { background: var(--ok); border-color: var(--ok); }
.nav-legend i.bad { background: var(--bad); border-color: var(--bad); }
.nav-legend i.cur { box-shadow: inset 0 0 0 2px var(--brand); }

.qcard {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 17px 15px 19px;
  box-shadow: var(--shadow);
}
@media (min-width: 700px) { .qcard { padding: 25px 27px 27px; } }

.qmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 9px; }
.qnum { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .03em; margin-right: 2px; font-variant-numeric: tabular-nums; }
.tag {
  font-size: 11px;
  line-height: 1;
  padding: 5px 8px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--muted);
  border: 1px solid var(--line);
  white-space: nowrap;
}
.tag.type { color: var(--brand-strong); background: var(--brand-soft); border-color: transparent; }
.tag.hot { color: var(--warn); background: var(--warn-soft); border-color: var(--warn-line); }
.tag.ok { color: var(--ok); background: var(--ok-soft); border-color: var(--ok-line); }

.stem {
  margin: 2px 0 4px;
  font-size: 18px;
  line-height: 1.65;
  font-weight: 600;
  letter-spacing: .01em;
  overflow-wrap: break-word;
}
@media (min-width: 700px) { .stem { font-size: 19.5px; } }

.q-hint { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); }

.options { margin-top: 13px; display: grid; gap: 8px; }
.opt {
  display: flex;
  align-items: flex-start;
  gap: 11px;
  width: 100%;
  min-height: 48px;
  text-align: left;
  padding: 10px 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 12px;
  cursor: pointer;
  transition: border-color .12s ease, background .12s ease;
}
.opt .key {
  flex: 0 0 27px;
  width: 27px;
  height: 27px;
  margin-top: 1px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  display: grid;
  place-items: center;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--muted);
}
.opt .text { flex: 1; min-width: 0; font-size: 15px; line-height: 1.55; color: var(--ink); overflow-wrap: break-word; }
.opt .mark { flex: 0 0 18px; margin-top: 3px; font-size: 13px; font-weight: 700; text-align: center; }
.opt:hover { border-color: var(--brand); }
.opt.selected { background: var(--brand-soft); border-color: var(--brand); }
.opt.selected .key { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.opt.selected .mark { color: var(--brand-strong); }
.opt.correct { background: var(--ok-soft); border-color: var(--ok-line); }
.opt.correct .key { background: var(--ok); border-color: var(--ok); color: #fff; }
.opt.correct .mark { color: var(--ok); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad-line); }
.opt.wrong .key { background: var(--bad); border-color: var(--bad); color: #fff; }
.opt.wrong .mark { color: var(--bad); }
.opt:disabled { opacity: 1; cursor: default; }
.opt:disabled:hover { border-color: var(--line); }
.opt.correct:disabled:hover { border-color: var(--ok-line); }
.opt.wrong:disabled:hover { border-color: var(--bad-line); }

.feedback {
  margin-top: 15px;
  scroll-margin-bottom: 112px;
  padding: 11px 13px;
  border: 1px solid;
  border-radius: 13px;
  display: flex;
  align-items: center;
  gap: 11px;
  flex-wrap: wrap;
}
.feedback.ok { background: var(--ok-soft); border-color: var(--ok-line); }
.feedback.bad { background: var(--bad-soft); border-color: var(--bad-line); }
.fb-main { flex: 1; min-width: 170px; }
.fb-title { font-size: 14.5px; font-weight: 700; }
.feedback.ok .fb-title { color: var(--ok); }
.feedback.bad .fb-title { color: var(--bad); }
.fb-sub { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.fb-sub b { font-weight: 700; }
.fb-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.fb-btn {
  border: 1px solid currentColor;
  background: transparent;
  border-radius: 9px;
  padding: 5px 10px;
  font-size: 12px;
  line-height: 1.4;
  cursor: pointer;
  color: var(--ink-2);
}
.fb-btn:hover { background: color-mix(in srgb, currentColor 8%, transparent); }

.note {
  margin-top: 11px;
  padding: 9px 12px;
  border: 1px solid var(--warn-line);
  background: var(--warn-soft);
  border-radius: 11px;
  font-size: 12.5px;
  line-height: 1.6;
  color: var(--ink-2);
}
.note b { color: var(--warn); }

.keyhint {
  margin: 13px 2px 0;
  font-size: 11.5px;
  color: var(--muted);
  text-align: center;
}
@media (hover: none), (pointer: coarse) { .keyhint { display: none; } }

.actionbar {
  position: sticky;
  bottom: 0;
  z-index: 20;
  padding: 10px 13px calc(10px + env(safe-area-inset-bottom));
  background: linear-gradient(to top, var(--bg) 60%, transparent);
}
@media (min-width: 700px) { .actionbar { padding-left: 24px; padding-right: 24px; } }
.actionbar-inner { max-width: 820px; margin: 0 auto; display: flex; gap: 9px; }
.actionbar .btn { min-height: 50px; }
.actionbar .btn.prev { flex: 0 0 102px; }
.actionbar .btn.next { flex: 1; }
.actionbar .btn.skip { flex: 0 0 70px; font-size: 13px; }

/* ---------- wrong book ---------- */

.wrong-wrap { max-width: 820px; margin: 0 auto; padding: 13px 13px calc(36px + env(safe-area-inset-bottom)); }
@media (min-width: 700px) { .wrong-wrap { padding: 18px 24px 48px; } }

.wrong-summary {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 11px;
  box-shadow: var(--shadow-soft);
}
.wrong-summary .grow { flex: 1; min-width: 150px; }
.wrong-summary .big { font-size: 14.5px; font-weight: 650; }
.wrong-summary .big strong { font-size: 19px; color: var(--brand-strong); font-variant-numeric: tabular-nums; }
.wrong-summary .sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.summary-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.mini-btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 9px;
  padding: 6px 10px;
  font-size: 11.5px;
  line-height: 1.4;
  color: var(--ink-2);
  cursor: pointer;
  min-height: 32px;
}
.mini-btn:hover { border-color: var(--brand); color: var(--brand-strong); }

@media (max-width: 480px) {
  .wrong-summary { align-items: flex-start; }
  .wrong-summary .grow { flex: 1 1 100%; min-width: 0; }
  .summary-actions { width: 100%; }
}

.filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 6px 11px;
  font-size: 11.5px;
  line-height: 1.4;
  color: var(--muted);
  cursor: pointer;
  min-height: 31px;
}
.chip:hover { border-color: var(--brand); }
.chip.active { background: var(--brand); border-color: var(--brand); color: var(--on-brand); }
.chip .n { opacity: .75; margin-left: 3px; font-variant-numeric: tabular-nums; }

.wrong-list { display: grid; gap: 10px; margin-top: 11px; }

.wrong-item {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 15px 14px 14px;
  box-shadow: var(--shadow-soft);
}
@media (min-width: 700px) { .wrong-item { padding: 18px 19px 16px; } }

    r.tries = Math.max(0, parseInt(r.tries, 10) || 0);
    r.wrong = Math.max(0, parseInt(r.wrong, 10) || 0);
    r.mastered = !!r.mastered;
    return r;
  }

  function normalizeSession(s) {
    if (!s || !Array.isArray(s.ids) || !s.ids.length) return null;
    if (typeof s.scope !== 'string') return null;
    if (s.scope !== 'all' && s.scope !== 'wrong' && s.scope.indexOf('ch:') !== 0) return null;
    var ch = s.scope.indexOf('ch:') === 0 ? s.scope.slice(3) : null;
    var ids = [];
    s.ids.forEach(function (id) {
      var q = QMAP.get(id);
      if (!q) return;
      if (ch === null || q.ch === ch) ids.push(id);
    });
    if (!ids.length) return null;
    s.ids = ids;
    s.mode = s.mode === 'random' ? 'random' : 'seq';
    s.idx = Math.min(Math.max(0, parseInt(s.idx, 10) || 0), ids.length - 1);
    if (!s.answers || typeof s.answers !== 'object') s.answers = {};
    if (!s.drafts || typeof s.drafts !== 'object') s.drafts = {};
    return s;
  }

  function loadState() {
    var base = { v: 1, rec: {}, session: null, prefMode: 'seq', sessions: {}, rounds: [] };
    var raw = null;
    try {
      raw = localStorage.getItem(LS_KEY);
    } catch (e) {
      storageOK = false;
      return base;
    }
    if (!raw) return base;
    var saved;
    try {
      saved = JSON.parse(raw);
    } catch (e) {
      return base;
    }
    if (!saved || saved.v !== 1) return base;
    var rec = {};
    if (saved.rec && typeof saved.rec === 'object') {
      Object.keys(saved.rec).forEach(function (id) {
        if (!QMAP.has(id)) return;
        var r = normalizeRecord(saved.rec[id]);
        if (r) rec[id] = r;
      });
    }
    base.rec = rec;
    base.prefMode = saved.prefMode === 'random' ? 'random' : 'seq';
    base.sessions = {};
    Object.keys(saved.sessions || {}).forEach(function(k) { var v=normalizeSession(saved.sessions[k]); if(v && v.scope===k) base.sessions[k]=v; });
    base.rounds = Array.isArray(saved.rounds) ? saved.rounds : [];
    base.session = normalizeSession(saved.session);
    if(base.session) base.sessions[base.session.scope]=base.session;
    return base;
  }

  function save() {
    state.session = session;
    if(!state.sessions) state.sessions={};
    if(session) state.sessions[session.scope]=session;
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(state));
    } catch (e) {
      if (storageOK) {
        storageOK = false;
        toast('无法保存进度（浏览器限制），仍可继续刷题');
      }
    }
  }

  /* ---------------- helpers ---------------- */

  function currentQ() {
    return session ? QMAP.get(session.ids[session.idx]) : null;
  }

  function scopeLabel(scope) {
    if (scope === 'all') return '全部题目';
    if (scope === 'wrong') return '错题重练';
    if (scope && scope.indexOf('ch:') === 0) return scope.slice(3);
    return '练习';
  }

  function modeLabel(mode) {
    return mode === 'random' ? '随机' : '顺序';
  }

  function wrongQuestions() {
    return QUESTIONS.filter(function (q) {
      var r = state.rec[q.id];
      return !!r && r.wrong > 0 && !r.mastered;
    });
  }

  function isWrong(id) {
    var r = state.rec[id];
    return !!r && r.wrong > 0 && !r.mastered;
  }

  function idsForScope(scope) {
    if (scope === 'all') {
      return QUESTIONS.map(function (q) { return q.id; });
    }
    if (scope === 'wrong') {
      return wrongQuestions().map(function (q) { return q.id; });
    }
    if (scope.indexOf('ch:') === 0) {
      var ch = scope.slice(3);
      return QUESTIONS.filter(function (q) { return q.ch === ch; }).map(function (q) { return q.id; });
    }
    return [];
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i];
      a[i] = a[j];
      a[j] = t;
    }
    return a;
  }

  function sameSet(a, b) {
    var A = a.slice().sort();
    var B = b.slice().sort();
    if (A.length !== B.length) return false;
    for (var i = 0; i < A.length; i++) {
      if (A[i] !== B[i]) return false;
    }
    return true;
  }

  function getDraft(id) {
    if (!session.drafts[id]) session.drafts[id] = [];
    return session.drafts[id];
  }

  function toast(msg) {
    var el = $('#toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
  }

  function openDialog(dlg) {
    if (typeof dlg.showModal === 'function') dlg.showModal();
    else dlg.setAttribute('open', '');
  }

  function closeDialog(dlg) {
    if (typeof dlg.close === 'function') dlg.close();
    else dlg.removeAttribute('open');
  }

  function askConfirm(opts) {
    var dlg = $('#confirm-dialog');
    if (dlg.open) return Promise.resolve(false);
    if (typeof dlg.showModal !== 'function') {
      return Promise.resolve(window.confirm(opts.title + '\n\n' + opts.text));
    }
    $('#confirm-title').textContent = opts.title;
    $('#confirm-text').textContent = opts.text;
    var okBtn = $('#confirm-ok');
    okBtn.textContent = opts.okText || '确定';
    okBtn.className = 'btn ' + (opts.danger ? 'danger' : 'primary');
    return new Promise(function (resolve) {
      var result = false;
      function cleanup() {
        okBtn.removeEventListener('click', onOk);
        $('#confirm-cancel').removeEventListener('click', onCancel);
        dlg.removeEventListener('cancel', onEsc);
        dlg.removeEventListener('close', onClose);
      }
      function finish(v) {
        result = v;
        closeDialog(dlg);
      }
      function onOk() { finish(true); }
      function onCancel() { finish(false); }
      function onEsc(e) { e.preventDefault(); finish(false); }
      function onClose() {
        cleanup();
        resolve(result);
      }
      okBtn.addEventListener('click', onOk);
      $('#confirm-cancel').addEventListener('click', onCancel);
      dlg.addEventListener('cancel', onEsc);
      dlg.addEventListener('close', onClose);
      openDialog(dlg);
    });
  }

  function showView(name) {
    view = name;
    ['home', 'practice', 'wrong'].forEach(function (v) {
      document.getElementById('view-' + v).hidden = (v !== name);
    });
    if (name === 'home') renderHome();
    if (name === 'wrong') renderWrong();
    window.scrollTo(0, 0);
  }

  /* ---------------- home ---------------- */

  function renderHome() {
    var total = QUESTIONS.length;
    var attempted = 0;
    var correct = 0;
    QUESTIONS.forEach(function (q) {
      var r = state.rec[q.id];
      if (!r) return;
      attempted++;
      if (r.ok) correct++;
    });
    var wrongN = wrongQuestions().length;

    $('#stat-done').textContent = attempted;
    $('#stat-total').textContent = total;
    $('#stat-acc').textContent = attempted ? Math.round(correct / attempted * 100) + '%' : '—';
    $('#stat-wrong').textContent = wrongN;

    var rslot = $('#resume-slot');
    var answered = session ? Object.keys(session.answers || {}).length : 0;
    var allDone = !!session && answered === session.ids.length;
    if (session && (answered > 0 || session.idx > 0)) {
      rslot.innerHTML =
        '<div class="resume">' +
          '<div class="grow">' +
            '<div class="resume-kicker">' + (allDone ? '上次练习' : '继续上次') + '</div>' +
            '<div class="resume-title">' + esc(scopeLabel(session.scope)) + ' · ' + modeLabel(session.mode) + '</div>' +
            '<div class="resume-sub">' + (allDone
              ? '本轮已完成 · 共 ' + session.ids.length + ' 题'
              : '第 ' + (session.idx + 1) + ' / ' + session.ids.length + ' 题 · 本轮已答 ' + answered + ' 题') + '</div>' +
          '</div>' +
          '<button type="button" class="btn primary" id="btn-resume">' + (allDone ? '查看结果' : '继续') + '</button>' +
        '</div>';
      rslot.hidden = false;
    } else {
      rslot.innerHTML = '';
      rslot.hidden = true;
    }

    $('#chapter-list').innerHTML = CHAPTERS.map(function (ch) {
      var qs = QUESTIONS.filter(function (q) { return q.ch === ch; });
      var a = 0;
      var c = 0;
      qs.forEach(function (q) {
        var r = state.rec[q.id];
        if (!r) return;
        a++;
        if (r.ok) c++;
      });
      var pct = a ? Math.round(c / a * 100) : null;
      return '<button type="button" class="chapter-card" data-ch="' + esc(ch) + '">' +
        '<div class="chapter-top">' +
          '<span class="chapter-name">' + esc(ch) + '</span>' +
          '<span class="chapter-count">' + qs.length + ' 题</span>' +
        '</div>' +
        '<div class="bar"><i style="width:' + (a / qs.length * 100) + '%"></i></div>' +
        '<div class="chapter-foot">' +
          '<span>' + (state.sessions['ch:'+ch] ? '继续第 '+(state.sessions['ch:'+ch].idx+1)+' 题 · 本轮已答 '+Object.keys(state.sessions['ch:'+ch].answers).length : '尚未开始本轮') + '</span>' +
          '<span>' + (pct === null ? '尚未练习' : '正确率 ' + pct + '%') + '</span>' +
        '</div>' +
      '</button>';
    }).join('');

    $$('#mode-seg button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-mode') === pendingMode);
    });

    var wp = $('#btn-wrong-practice');
    wp.disabled = wrongN === 0;
    wp.textContent = wrongN ? '错题重练（' + wrongN + '）' : '暂无错题';

    $('#btn-wrong-book').disabled = false;
  }

  function startSession(scope, mode, focusId, fresh) {
    save();
    var previous = state.sessions && state.sessions[scope];
    if(previous && !fresh && !focusId) {
      session=previous; navOpen=false; save(); renderPractice(); showView('practice'); return;
    }
    if(previous && (fresh || focusId)) {
      if(!state.rounds) state.rounds=[];
      state.rounds.push(JSON.parse(JSON.stringify(previous)));
    }
    var ids = idsForScope(scope);
    if (!ids.length) {
      toast(scope === 'wrong' ? '错题本是空的，先做几道题吧' : '暂无题目');
      return;
    }
    if (mode === 'random') shuffle(ids);
    var idx = 0;
    if (focusId) {
      var i = ids.indexOf(focusId);
      if (i >= 0) idx = i;
    }
    session = {
      scope: scope,
      mode: mode,
      ids: ids,
      idx: idx,
      answers: {},
      drafts: {},
      started: Date.now()
    };
    navOpen = false;
    save();
    renderPractice();
    showView('practice');
  }

  /* ---------------- practice ---------------- */

  function renderPractice() {
    var q = currentQ();
    if (!q) {
      showView('home');
      return;
    }
    var len = session.ids.length;
    var answered = Object.keys(session.answers).length;
    $('#practice-title').textContent = scopeLabel(session.scope) + ' · ' + modeLabel(session.mode);
    $('#practice-progress-text').textContent = '第 ' + (session.idx + 1) + ' / ' + len + ' 题';
    $('#practice-progress-sub').textContent = '本轮已答 ' + answered + ' 题';
    $('#practice-progress-bar').style.width = (len ? answered / len * 100 : 0) + '%';
    $('#btn-nav-toggle').textContent = navOpen ? '收起列表' : '题目列表';
    $('#btn-nav-toggle').setAttribute('aria-expanded', navOpen ? 'true' : 'false');
    renderNavigator();
    renderQuestion();
    renderActionbar();
  }

  function updateProgress() {
    if (!session) return;
    var len = session.ids.length;
    var answered = Object.keys(session.answers).length;
    $('#practice-progress-text').textContent = '第 ' + (session.idx + 1) + ' / ' + len + ' 题';
    $('#practice-progress-sub').textContent = '本轮已答 ' + answered + ' 题';
    $('#practice-progress-bar').style.width = (len ? answered / len * 100 : 0) + '%';
  }

  function renderNavigator() {
    var nav = $('#navigator');
    if (!navOpen || !session) {
      nav.hidden = true;
      return;
    }
    nav.hidden = false;
    $('#nav-grid').innerHTML = session.ids.map(function (id, i) {
      var a = session.answers[id];
      var cls = 'nav-cell' + (a ? (a.ok ? ' ok' : ' bad') : '') + (i === session.idx ? ' current' : '');
      var stateText = a ? (a.ok ? '答对' : '答错') : '未答';
      return '<button type="button" class="' + cls + '" data-i="' + i + '" title="第 ' + (i + 1) + ' 题 · ' + stateText + '">' + (i + 1) + '</button>';
    }).join('');

    var grid = $('#nav-grid');
    var cur = grid.querySelector('.nav-cell.current');
    if (cur) {
      var gr = grid.getBoundingClientRect();
      var cr = cur.getBoundingClientRect();
      if (cr.top < gr.top || cr.bottom > gr.bottom) {
        grid.scrollTop += (cr.top - gr.top) - (grid.clientHeight - cur.offsetHeight) / 2;
      }
    }
  }

  function renderQuestion() {
    var q = currentQ();
    var ans = session.answers[q.id];
    var locked = !!ans;
    var draft = locked ? [] : getDraft(q.id);
    var showCh = session.scope === 'all' || session.scope === 'wrong';

    var optsHTML = q.opts.map(function (o) {
      var cls = 'opt';
      var mark = '';
      var pressed = 'false';
      if (locked) {
        cls += ' answered';
        if (q.ans.indexOf(o.k) >= 0) {
          cls += ' correct';
          mark = '✓';
        } else if (ans.sel.indexOf(o.k) >= 0) {
          cls += ' wrong';
          mark = '✕';
        }
      } else if ((q.type === '多选' || !q.ans.length) && draft.indexOf(o.k) >= 0) {
        cls += ' selected';
        mark = '✓';
        pressed = 'true';
      }
      return '<button type="button" class="' + cls + '" data-k="' + o.k + '"' +
        (locked ? ' disabled' : ' aria-pressed="' + pressed + '"') + '>' +
        '<span class="key">' + o.k + '</span>' +
        '<span class="text">' + esc(o.t) + '</span>' +
        '<span class="mark" aria-hidden="true">' + mark + '</span>' +
      '</button>';
    }).join('');

    var meta = '<div class="qmeta">' +
      '<span class="qnum">第 ' + (session.idx + 1) + ' 题</span>' +
      (showCh ? '<span class="tag">' + esc(q.ch) + '</span>' : '') +
      '<span class="tag type">' + (q.type === '多选' ? '多选' : '单选') + '</span>' +
      (q.freq >= 2 ? '<span class="tag hot" title="原资料中多次出现">高频</span>' : '') +
    '</div>';

    var hint = (!locked && q.type === '多选')
      ? '<p class="q-hint">多选题：选好全部选项后点“提交答案”。</p>'
      : '';

    $('#question-area').innerHTML =
      '<article class="qcard">' +
        meta +
        '<h2 class="stem">' + esc(q.stem) + '</h2>' +
        hint +
        '<div class="options" role="group" aria-label="选项">' + optsHTML + '</div>' +
        feedbackHTML(q, ans) +
        (q.note ? '<div class="note"><b>提示</b>　' + esc(q.note) + '</div>' : '') +
      '</article>' +
      '<p class="keyhint">键盘：A–E 选择 · Enter 下一题 · ← → 切换</p>';
  }

  function feedbackHTML(q, ans) {
    if (!ans) return '';
    var right = q.ans.join('、');
    var actions = '<button type="button" class="fb-btn" data-act="retry">重做</button>';
    if (ans.ok && isWrong(q.id)) {
      actions += '<button type="button" class="fb-btn" data-act="master">移出错题本</button>';
    }
    var body = ans.ok
      ? '正确答案：<b>' + right + '</b>'
      : '你的答案：<b>' + (ans.sel.join('、') || '未选') + '</b>　正确答案：<b>' + right + '</b>';
    return '<div class="feedback ' + (ans.ok ? 'ok' : 'bad') + '" role="status">' +
      '<div class="fb-main">' +
        '<div class="fb-title">' + (ans.ok ? '回答正确' : '回答错误') + '</div>' +
        '<div class="fb-sub">' + body + '</div>' +
      '</div>' +
      '<div class="fb-actions">' + actions + '</div>' +
    '</div>';
  }

  function renderActionbar() {
    var q = currentQ();
    var ans = session.answers[q.id];
    var last = session.idx === session.ids.length - 1;
    var multiOpen = q.type === '多选' && !ans;
    var draft = multiOpen ? getDraft(q.id) : [];
    var right;

    if (multiOpen) {
      right = '<button type="button" class="btn primary next" id="btn-submit"' + (draft.length ? '' : ' disabled') + '>提交答案</button>' +
        '<button type="button" class="btn ghost skip" id="btn-skip">跳过</button>';
    } else {
      right = '<button type="button" class="btn ' + (ans ? 'primary' : 'ghost') + ' next" id="btn-next">' +
        (last ? '完成练习' : '下一题') + '</button>';
    }

    $('#actionbar').innerHTML = '<div class="actionbar-inner">' +
      '<button type="button" class="btn ghost prev" id="btn-prev"' + (session.idx === 0 ? ' disabled' : '') + '>上一题</button>' +
      right +
    '</div>';
  }

  function chooseOption(k) {
    var q = currentQ();
    if(q && !q.ans.length) { session.drafts[q.id]=[k]; save(); renderQuestion(); toast('已选择；本题暂无参考答案，不判分'); return; }
    if (!q || session.answers[q.id]) return;
    if (q.type === '多选') {
      var d = getDraft(q.id);
      var i = d.indexOf(k);
      if (i >= 0) d.splice(i, 1);
      else d.push(k);
      save();
      renderQuestion();
      renderActionbar();
    } else {
      submitAnswer([k]);
    }
  }

  function submitMulti() {
    var q = currentQ();
    if (!q || session.answers[q.id]) return;
    var d = getDraft(q.id).slice();
    if (!d.length) {
      toast('请先选择答案');
      return;
    }
    submitAnswer(d);
  }

  function submitAnswer(sel) {
    var q = currentQ();
    if (!q || session.answers[q.id]) return;
    sel = sel.slice().sort();
    var ok = sameSet(sel, q.ans);
    session.answers[q.id] = { sel: sel, ok: ok };
    delete session.drafts[q.id];

    var r = state.rec[q.id];
    if (!r) {
      r = state.rec[q.id] = { tries: 0, wrong: 0, mastered: false };
    }
    r.sel = sel.slice();
    r.ok = ok;
    r.tries = (r.tries || 0) + 1;
    r.ts = Date.now();
    if (!ok) {
      r.wrong = (r.wrong || 0) + 1;
      r.mastered = false;
    }
    save();
    renderQuestion();
    renderActionbar();
    renderNavigator();
    updateProgress();
    requestAnimationFrame(revealFeedback);
  }

  function revealFeedback() {
    var fb = $('#question-area .feedback');
    if (!fb) return;
    var rect = fb.getBoundingClientRect();
    var bar = $('#actionbar').getBoundingClientRect();
    if (rect.bottom > bar.top - 8 || rect.top < 0) {
      try {
        fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      } catch (e) {
        fb.scrollIntoView(false);
      }
    }
  }

  function retryCurrent() {
    var q = currentQ();
    if (!q) return;
    delete session.answers[q.id];
    delete session.drafts[q.id];
    save();
    renderPractice();
    window.scrollTo(0, 0);
  }

  function masterQuestion(id) {
    var r = state.rec[id];
    if (!r) return;
    r.mastered = true;
    save();
    toast('已移出错题本');
  }

  function goTo(n) {
    if (!session) return;
    if (n < 0) return;
    if (n >= session.ids.length) {
      openDone();
      return;
    }
    session.idx = n;
    navOpen = false;
    save();
    renderPractice();
    window.scrollTo(0, 0);
  }

  function openDone() {
    var total = session.ids.length;
    var vals = Object.keys(session.answers).map(function (id) { return session.answers[id]; });
    var answered = vals.length;
    var correct = vals.filter(function (a) { return a.ok; }).length;
    var pct = answered ? Math.round(correct / answered * 100) : 0;
    $('#done-title').textContent = answered >= total ? '本轮练习完成' : '本轮练习结束';
    $('#done-text').textContent = scopeLabel(session.scope) + ' · ' + modeLabel(session.mode) +
      (answered < total ? '（还有 ' + (total - answered) + ' 题未作答）' : '');
    $('#done-stats').innerHTML =
      '<div class="done-stat"><b>' + answered + '</b><span>已答</span></div>' +
      '<div class="done-stat"><b>' + correct + '</b><span>答对</span></div>' +
      '<div class="done-stat"><b>' + pct + '%</b><span>正确率</span></div>';
    $('#done-note').textContent = answered < total ? '可以继续把剩下的题做完。' : '';
    $('#done-continue').hidden = answered >= total;
    $('#done-continue').classList.toggle('primary', answered < total);
    $('#done-continue').classList.toggle('ghost', answered >= total);
    $('#done-home').classList.toggle('primary', answered >= total);
    $('#done-home').classList.toggle('ghost', answered < total);
    openDialog($('#done-dialog'));
  }

  function retrySession() {
    if(!state.rounds) state.rounds=[];
    state.rounds.push(JSON.parse(JSON.stringify(session)));
    session.started=Date.now();
    session.answers = {};
    session.drafts = {};
    session.idx = 0;
    save();
    renderPractice();
    showView('practice');
  }

  /* ---------------- wrong book ---------------- */

  function renderWrong() {
    var all = wrongQuestions();
    var corrected = all.filter(function (q) { return state.rec[q.id].ok; }).length;
    var filtered = all.filter(function (q) {
      if (wrongFilter.ch !== 'all' && q.ch !== wrongFilter.ch) return false;
      if (wrongFilter.type !== 'all' && q.type !== wrongFilter.type) return false;
      return true;
    });

    $('#wrong-summary').innerHTML =
      '<div class="grow">' +
        '<div class="big">共 <strong>' + all.length + '</strong> 道错题</div>' +
        '<div class="sub">' + (corrected
          ? '其中 ' + corrected + ' 道已答对，可移出错题本'
          : '做错的题会自动收进这里') + '</div>' +
      '</div>' +
      '<div class="summary-actions">' +
        (corrected ? '<button type="button" class="mini-btn" data-wrong-act="master-ok">移出已答对</button>' : '') +
        (all.length ? '<button type="button" class="mini-btn" data-wrong-act="clear-all">清空错题本</button>' : '') +
      '</div>';

    var chCounts = {};
    all.forEach(function (q) { chCounts[q.ch] = (chCounts[q.ch] || 0) + 1; });
    var typeCounts = { '单选': 0, '多选': 0 };
    all.forEach(function (q) { typeCounts[q.type] = (typeCounts[q.type] || 0) + 1; });

    var chips = '<button type="button" class="chip' + (wrongFilter.ch === 'all' ? ' active' : '') + '" data-filter-ch="all">全部<span class="n">' + all.length + '</span></button>';
    CHAPTERS.forEach(function (ch) {
      chips += '<button type="button" class="chip' + (wrongFilter.ch === ch ? ' active' : '') + '" data-filter-ch="' + esc(ch) + '">' +
        esc(ch) + '<span class="n">' + (chCounts[ch] || 0) + '</span></button>';
    });
    $('#wrong-filters').innerHTML = chips;

    var typeChips = '<button type="button" class="chip' + (wrongFilter.type === 'all' ? ' active' : '') + '" data-filter-type="all">全部题型<span class="n">' + all.length + '</span></button>' +
      ['单选', '多选'].map(function (t) {
        return '<button type="button" class="chip' + (wrongFilter.type === t ? ' active' : '') + '" data-filter-type="' + t + '">' +
          t + '<span class="n">' + (typeCounts[t] || 0) + '</span></button>';
      }).join('') +
      '<button type="button" class="chip" data-toggle-options>' + (showWrongOptions ? '隐藏选项' : '显示选项') + '</button>';
    $('#wrong-type-filters').innerHTML = typeChips;

    $('#btn-wrong-retry-all').disabled = all.length === 0;

    if (!all.length) {
      $('#wrong-list').innerHTML =
        '<div class="empty">' +
          '<div class="em-icon">✓</div>' +
          '<h3>暂无错题</h3>' +
          '<p>做错的题会自动收进这里，方便集中复习。</p>' +
          '<button type="button" class="btn primary" data-wrong-act="go-practice">去练习</button>' +
        '</div>';
      return;
    }

    if (!filtered.length) {
      $('#wrong-list').innerHTML =
        '<div class="empty">' +
          '<div class="em-icon">·</div>' +
          '<h3>没有符合条件的错题</h3>' +
          '<p>换个章节或题型看看。</p>' +
          '<button type="button" class="btn ghost" data-wrong-act="reset-filter">清除筛选</button>' +
        '</div>';
      return;
    }

    $('#wrong-list').innerHTML = filtered.map(function (q) {
      var rec = state.rec[q.id];
      var optsHTML = '';
      if (showWrongOptions) {
        optsHTML = '<div class="options">' + q.opts.map(function (o) {
          var cls = 'opt static answered';
          var mark = '';
          if (q.ans.indexOf(o.k) >= 0) {
            cls += ' correct';
            mark = '✓';
          } else if (rec.sel.indexOf(o.k) >= 0) {
            cls += ' wrong';
            mark = '✕';
          }
          return '<div class="' + cls + '">' +
            '<span class="key">' + o.k + '</span>' +
            '<span class="text">' + esc(o.t) + '</span>' +
            '<span class="mark" aria-hidden="true">' + mark + '</span>' +
          '</div>';
        }).join('') + '</div>';
      }
      return '<article class="wrong-item">' +
        '<div class="wrong-head">' +
          '<span class="grow">' + esc(q.ch) + ' · 原题 ' + q.num + '</span>' +
          '<span class="tag type">' + q.type + '</span>' +
          (q.freq >= 2 ? '<span class="tag hot">高频</span>' : '') +
          (rec.ok ? '<span class="tag ok">已答对</span>' : '') +
        '</div>' +
        '<h3>' + esc(q.stem) + '</h3>' +
        optsHTML +
        '<div class="wrong-answer">' +
          '<span>你的答案 <b class="bad">' + (rec.sel.join('、') || '未选') + '</b></span>' +
          '<span>正确答案 <b class="good">' + q.ans.join('、') + '</b></span>' +
          '<span>已错 ' + rec.wrong + ' 次</span>' +
        '</div>' +
        (q.note ? '<div class="note"><b>提示</b>　' + esc(q.note) + '</div>' : '') +
        '<div class="wrong-actions">' +
          '<button type="button" class="btn ghost" data-wrong-act="retry" data-id="' + q.id + '">重做本题</button>' +
          '<button type="button" class="btn ghost" data-wrong-act="remove" data-id="' + q.id + '">移出错题本</button>' +
        '</div>' +
      '</article>';
    }).join('');
  }

  /* ---------------- events ---------------- */

  function bindEvents() {
    $('#new-round-scope').innerHTML='<option value="all">全部题目</option>'+CHAPTERS.map(function(ch){return '<option value="'+esc('ch:'+ch)+'">'+esc(ch)+'</option>';}).join('');
    $('#new-round').addEventListener('click',function(){
      var scope=$('#new-round-scope').value;
      askConfirm({title:'开始新一轮？',text:'将归档该范围的上一轮，重新从第一题开始。累计记录与错题本保留。',okText:'开始新一轮'}).then(function(ok){if(ok)startSession(scope,pendingMode,null,true);});
    });
    $('#export-rounds').addEventListener('click',function(){save();var u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));var a=document.createElement('a');a.href=u;a.download=(bank==='neuro'?'神经生物学':'病理生理学')+'全部轮次.json';a.click();setTimeout(function(){URL.revokeObjectURL(u)},1000);});
    $('#chapter-list').addEventListener('click', function (e) {
      var card = e.target.closest('.chapter-card');
      if (!card) return;
      startSession('ch:' + card.getAttribute('data-ch'), pendingMode);
    });

    $('#mode-seg').addEventListener('click', function (e) {
      var b = e.target.closest('button[data-mode]');
      if (!b) return;
      pendingMode = b.getAttribute('data-mode');
      state.prefMode = pendingMode;
      save();
      $$('#mode-seg button').forEach(function (x) {
        x.classList.toggle('active', x === b);
      });
    });

    $('#btn-start-all').addEventListener('click', function () {
      startSession('all', pendingMode);
    });

    $('#btn-wrong-practice').addEventListener('click', function () {
      startSession('wrong', 'seq');
    });

    $('#btn-wrong-book').addEventListener('click', function () {
      showView('wrong');
    });

    $('#stat-wrong-card').addEventListener('click', function () {
      showView('wrong');
    });

    $('#resume-slot').addEventListener('click', function (e) {
      if (!e.target.closest('#btn-resume')) return;
      if (!session) return;
      renderPractice();
      showView('practice');
      if (Object.keys(session.answers).length === session.ids.length) openDone();
    });

    $('#btn-reset').addEventListener('click', function () {
      askConfirm({
        title: '清空全部记录？',
        text: '练习进度、正确率和错题本都会清空，且无法恢复。',
        okText: '全部清空',
        danger: true
      }).then(function (ok) {
        if (!ok) return;
        state = { v: 1, rec: {}, session: null, prefMode: pendingMode, sessions: {}, rounds: [] };
        session = null;
        save();
        showView('home');
        toast('已清空全部记录');
      });
    });

    $('#btn-practice-back').addEventListener('click', function () {
      showView('home');
    });

    $('#btn-nav-toggle').addEventListener('click', function () {
      navOpen = !navOpen;
      renderNavigator();
      $('#btn-nav-toggle').textContent = navOpen ? '收起列表' : '题目列表';
      $('#btn-nav-toggle').setAttribute('aria-expanded', navOpen ? 'true' : 'false');
      if (navOpen) window.scrollTo(0, 0);
    });

    $('#nav-grid').addEventListener('click', function (e) {
      var b = e.target.closest('[data-i]');
      if (!b) return;
      var i = parseInt(b.getAttribute('data-i'), 10);
      if (isNaN(i)) return;
      session.idx = i;
      navOpen = false;
      save();
      renderPractice();
      window.scrollTo(0, 0);
    });

    $('#question-area').addEventListener('click', function (e) {
      var fb = e.target.closest('[data-act]');
      if (fb) {
        var act = fb.getAttribute('data-act');
        var q = currentQ();
        if (!q) return;
        if (act === 'retry') retryCurrent();
        else if (act === 'master') {
          masterQuestion(q.id);
          renderQuestion();
        }
        return;
      }
      var opt = e.target.closest('.opt[data-k]');
      if (!opt) return;
      chooseOption(opt.getAttribute('data-k'));
    });

    $('#actionbar').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      if (b.id === 'btn-prev') goTo(session.idx - 1);
      else if (b.id === 'btn-next') goTo(session.idx + 1);
      else if (b.id === 'btn-submit') submitMulti();
      else if (b.id === 'btn-skip') goTo(session.idx + 1);
    });

    $('#btn-wrong-back').addEventListener('click', function () {
      showView('home');
    });

    $('#btn-wrong-retry-all').addEventListener('click', function () {
      startSession('wrong', 'seq');
    });

    $('#wrong-filters').addEventListener('click', function (e) {
      var b = e.target.closest('[data-filter-ch]');
      if (!b) return;
      wrongFilter.ch = b.getAttribute('data-filter-ch');
      renderWrong();
    });

    $('#wrong-type-filters').addEventListener('click', function (e) {
      var toggle = e.target.closest('[data-toggle-options]');
      if (toggle) {
        showWrongOptions = !showWrongOptions;
        renderWrong();
        return;
      }
      var b = e.target.closest('[data-filter-type]');
      if (!b) return;
      wrongFilter.type = b.getAttribute('data-filter-type');
      renderWrong();
    });

    $('#wrong-list').addEventListener('click', function (e) {
      var b = e.target.closest('[data-wrong-act]');
      if (!b) return;
      var act = b.getAttribute('data-wrong-act');
      if (act === 'retry') {
        startSession('wrong', 'seq', b.getAttribute('data-id'));
      } else if (act === 'remove') {
        masterQuestion(b.getAttribute('data-id'));
        renderWrong();
      } else if (act === 'go-practice') {
        startSession('all', pendingMode);
      } else if (act === 'reset-filter') {
        wrongFilter = { ch: 'all', type: 'all' };
        renderWrong();
      }
    });

    $('#wrong-summary').addEventListener('click', function (e) {
      var b = e.target.closest('[data-wrong-act]');
      if (!b) return;
      var act = b.getAttribute('data-wrong-act');
      if (act === 'master-ok') {
        var n = 0;
        wrongQuestions().forEach(function (q) {
          if (state.rec[q.id].ok) {
            state.rec[q.id].mastered = true;
            n++;
          }
        });
        save();
        renderWrong();
        toast('已移出 ' + n + ' 道已答对的错题');
      } else if (act === 'clear-all') {
        askConfirm({
          title: '清空错题本？',
          text: '所有错题会从错题本移除，答题记录和正确率会保留。',
          okText: '清空'
        }).then(function (ok) {
          if (!ok) return;
          wrongQuestions().forEach(function (q) {
            state.rec[q.id].mastered = true;
          });
          save();
          renderWrong();
          toast('错题本已清空');
        });
      }
    });

    $('#done-home').addEventListener('click', function () {
      closeDialog($('#done-dialog'));
      showView('home');
    });

    $('#done-retry').addEventListener('click', function () {
      closeDialog($('#done-dialog'));
      retrySession();
    });

    $('#done-continue').addEventListener('click', function () {
      closeDialog($('#done-dialog'));
      var idx = -1;
      for (var i = 0; i < session.ids.length; i++) {
        if (!session.answers[session.ids[i]]) { idx = i; break; }
      }
      if (idx < 0) idx = session.ids.length - 1;
      session.idx = idx;
      save();
      renderPractice();
      window.scrollTo(0, 0);
    });

    $('#done-wrong').addEventListener('click', function () {
      closeDialog($('#done-dialog'));
      showView('wrong');
    });

    document.addEventListener('keydown', function (e) {
      if (view !== 'practice' || !session) return;
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (document.querySelector('dialog[open]')) return;
      var tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
      var q = currentQ();
      if (!q) return;
      var ans = session.answers[q.id];

      var letter = null;
      if (/^[a-eA-E]$/.test(e.key)) letter = e.key.toUpperCase();
      else if (/^[1-5]$/.test(e.key)) letter = 'ABCDE'.charAt(parseInt(e.key, 10) - 1);

      if (letter && q.opts.some(function (o) { return o.k === letter; })) {
        e.preventDefault();
        if (!ans) chooseOption(letter);
        return;
      }
      if (e.key === 'Enter') {
        if (tag === 'button') return;
        e.preventDefault();
        if (!ans && q.type === '多选') submitMulti();
        else goTo(session.idx + 1);
        return;
      }
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        goTo(session.idx + 1);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        goTo(session.idx - 1);
      }
    });
  }

  /* ---------------- boot ---------------- */

  state = loadState();
  session = state.session;
  pendingMode = state.prefMode;
  bindEvents();
  showView('home');
  if (!storageOK) {
    setTimeout(function () {
      toast('浏览器未开启本地存储，进度可能无法保存');
    }, 500);
  }
})();

</script>
</body>
</html>
